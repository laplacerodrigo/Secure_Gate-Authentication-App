<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ url_for('media_file', filename='favicon.png') }}">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="auth-page">

            <div class="lightning-layer" aria-hidden="true">
                <span class="lightning lightning-one"></span>
                <span class="lightning lightning-two"></span>
                <span class="lightning lightning-three"></span>
            </div>

        <section class="auth-card">
            <img class="auth-logo" src="{{ url_for('static', filename='images/laplace-logo-transparent.png') }}" alt="Laplace Electric">
            <h1>Login</h1>
            <p class="auth-subtitle">Access your account</p>

            <form method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <input type="text" name="usuario" placeholder="Username">
                <input type="password" name="password" placeholder="Password">

                <button type="submit">Login</button>

                {% if error %}
                    <p id="error-message" class="error-message">{{ error }}</p>
                {% endif %}
            </form>

            <div class="auth-links">
                <a href="{{ url_for('forgot_credentials') }}">Forgot Username or Password</a>
                <a href="{{ url_for('registro') }}">Create a new user</a>
            </div>
        </section>
    </main>

    <script>
        setTimeout(function() {
            const errorMessage = document.getElementById("error-message");

            if (errorMessage) {
                errorMessage.style.display = "none";
            }
        }, 2000);
    </script>

</body>
</html>
