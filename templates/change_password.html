<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.ico') }}">
    <title>Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="auth-page">
        <div class="lightning-layer" aria-hidden="true">
            <span class="lightning lightning-one"></span>
            <span class="lightning lightning-two"></span>
            <span class="lightning lightning-three"></span>
        </div>

        <section class="auth-card">
            <h1>Change Password</h1>
            <p class="auth-subtitle">Create a new password for your account</p>

            <form method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <input type="password" name="current_password" placeholder="Current password">
                <input type="password" name="new_password" placeholder="New password">
                <input type="password" name="confirm_password" placeholder="Confirm new password">

                <button type="submit">Update Password</button>

                {% if error %}
                    <p id="error-message" class="error-message">{{ error }}</p>
                {% endif %}
            </form>

            <div class="auth-links">
                <form method="POST" action="{{ url_for('logout') }}">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <button type="submit">Back to Login</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        setTimeout(function() {
            const errorMessage = document.getElementById("error-message");

            if (errorMessage) {
                errorMessage.style.display = "none";
            }
        }, 2500);
    </script>

</body>
</html>
